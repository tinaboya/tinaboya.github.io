<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boya Zhang · Industry</title>
<meta name="description" content="Boya Zhang: trustworthy machine learning for high-stakes decision making, with healthcare as the main application area.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root {
    --bg: #fbfaf7;
    --surface: #ffffff;
    --text: #1f2328;
    --muted: #5b6370;
    --accent: #123456;
    --accent-soft: #e8eef5;
    --rule: #e3e0d8;
    --grid: rgba(18,52,86,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13161b;
      --surface: #1b1f26;
      --text: #e6e8eb;
      --muted: #9aa3ae;
      --accent: #8fb6e0;
      --accent-soft: #1f2a37;
      --rule: #2a2f37;
      --grid: rgba(143,182,224,.06);
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background-color: var(--bg);
    /* squared-notebook paper: faint grid lines every 24px */
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--text);
    font: 18px/1.6 "Crimson Pro", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap {
    max-width: 1060px;
    margin: 0 auto;
    padding: 56px 24px 72px;
    display: grid;
    grid-template-columns: 310px 1fr;
    gap: 44px;
  }
  /* ---------- sidebar ---------- */
  aside { position: sticky; top: 40px; align-self: start; }
  .photo {
    width: 168px; height: 168px; border-radius: 50%;
    object-fit: cover; display: block; margin-bottom: 20px;
    border: 3px solid var(--surface);
    box-shadow: 0 2px 14px rgba(0,0,0,.08);
  }
  h1 {
    font-family: "Crimson Pro", Georgia, serif;
    font-weight: 600; font-size: 30px; line-height: 1.2;
    margin: 0 0 6px;
  }
  .role { color: var(--muted); font-size: 15px; margin: 0 0 22px; }
  .aff { font-size: 15px; }
  .email { font-size: 15px; margin: 0 0 14px; }
  .email a { color: var(--muted); }
  .email a:hover { color: var(--accent); text-decoration: none; }
  .email i { margin-right: 6px; color: var(--accent); }
  .icons { display: flex; gap: 4px; margin: 0 0 22px; }
  .icons a {
    width: 40px; height: 40px; border-radius: 50%; display: inline-flex;
    align-items: center; justify-content: center; font-size: 19px;
    color: var(--accent); transition: transform .15s, background .15s;
  }
  .icons a:hover { background: var(--accent-soft); transform: scale(1.12); text-decoration: none; }
  .switch { font-size: 15px; }
  .switch .on { font-weight: 600; color: var(--accent); }
  .switch .sep { color: var(--muted); margin: 0 8px; }
  .switch a { color: var(--muted); }
  .switch a:hover { color: var(--accent); }
  nav { margin-top: 28px; font-size: 14px; border-top: 1px solid var(--rule); padding-top: 18px; }
  nav a { display: block; color: var(--muted); padding: 3px 0; }
  nav a:hover { color: var(--accent); text-decoration: none; }
  /* ---------- main ---------- */
  main { min-width: 0; overflow-wrap: break-word; }
  main section { margin-bottom: 52px; scroll-margin-top: 32px; }
  h2 {
    font-family: "Crimson Pro", Georgia, serif;
    font-weight: 600; font-size: 22px; margin: 0 0 16px;
    padding-bottom: 8px; border-bottom: 1px solid var(--rule);
  }
  h3 { font-size: 15px; font-weight: 600; margin: 26px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  p { margin: 0 0 14px; }
  .news { list-style: none; padding: 0; margin: 0; }
  .news li { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 7px 0; border-bottom: 1px dashed var(--rule); }
  .news li:last-child { border-bottom: 0; }
  .news .date { font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
  .interests { list-style: none; padding: 0; margin: 0; }
  .interests li { padding: 10px 0; border-bottom: 1px dashed var(--rule); }
  .interests li:last-child { border-bottom: 0; }
  .interests strong { color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: 12px; padding: 18px 20px;
  }
  .tag {
    display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .05em;
    text-transform: uppercase; color: var(--accent);
    background: var(--accent-soft); padding: 2px 10px; border-radius: 999px; margin-bottom: 8px;
  }
  .card h4 { margin: 0 0 6px; font-size: 16px; }
  .card p { margin: 0 0 8px; font-size: 14.5px; color: var(--muted); }
  .card .venue { font-size: 13.5px; font-weight: 500; }
  .pubs { list-style: none; padding: 0; margin: 0; }
  .pubs li { padding: 10px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
  .pubs li:last-child { border-bottom: 0; }
  .pubs .title { font-weight: 500; }
  .pubs .meta { display: block; color: var(--muted); font-size: 14px; }
  .pubs .venue { font-style: italic; }
  .activities { padding-left: 18px; margin: 0; }
  .activities li { margin: 8px 0; }
  .soon-page .big { font-size: 34px; font-weight: 600; margin: 28px 0 14px; }
  footer { grid-column: 1 / -1; color: var(--muted); font-size: 13px; border-top: 1px solid var(--rule); padding-top: 18px; }
  @media (max-width: 820px) {
    .wrap { grid-template-columns: 1fr; gap: 36px; padding: 32px 16px 56px; }
    aside { position: static; text-align: center; }
    .photo { margin: 0 auto 18px; width: 140px; height: 140px; }
    .icons { justify-content: center; }
    nav { display: none; }
    .cards { grid-template-columns: 1fr; }
    .news li { grid-template-columns: 78px 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <aside>
    <img class="photo" src="assets/img/boyazh_picture.jpg" alt="Portrait of Boya Zhang">
    <h1>Boya Zhang</h1>
    <p class="role">PhD in AI for Healthcare, Université de Genève<br>Research Affiliate, MIT</p>
    <p class="email"><a class="mail" href="#" data-u="boya_zh" data-d="mit.edu" title="Send email"><i class="fas fa-envelope"></i> boya_zh (at) mit.edu</a></p>
    <div class="icons">
      <a href="assets/cv/Boya_Zhang_CV.pdf" title="CV" aria-label="CV"><i class="ai ai-cv"></i></a>
      <a href="https://orcid.org/0000-0002-4439-8212" title="ORCID" aria-label="ORCID"><i class="ai ai-orcid"></i></a>
      <a href="https://github.com/tinaboya" title="GitHub" aria-label="GitHub"><i class="fab fa-github"></i></a>
      <a href="https://huggingface.co/tinaboya" title="Hugging Face" aria-label="Hugging Face">🤗</a>
      <a href="https://www.linkedin.com/in/tinaboya" title="LinkedIn" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
    </div>
    <div class="switch" role="navigation" aria-label="Site version">
      <a href="index.html">Academia</a><span class="sep">/</span><span class="on" aria-current="page">Industry</span>
    </div>
  </aside>

  <main>
    <section class="soon-page">
      <h2>Industry</h2>
      <p class="big">Coming soon.</p>
      <p>This version of the site is in preparation. In the meantime, the <a href="index.html">academic version</a> has my research, publications and CV.</p>
    </section>
  </main>

  <footer>Last updated November 2026.</footer>
</div>
<script>
  // the address is assembled here so that it is not readable by simple scrapers
  document.querySelectorAll('a.mail').forEach(function (a) {
    a.href = 'mailto:' + a.dataset.u + '@' + a.dataset.d;
  });
</script>
</body>
</html>
